# Netlify config for the KilloKart frontend.
# Base directory when connecting the repo: frontend
[build]
  base = "frontend"
  command = "npm run build"
  publish = "frontend/dist"

# SPA fallback — all routes serve index.html so React Router works.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
