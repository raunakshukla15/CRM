# Render blueprint for KilloKart backend + MySQL.
# In Render: New → Blueprint → connect this repo → select this file.
# Then set the secret env vars listed under `envVars` (marked sync: false).

services:
  - type: pserv
    name: killokart-mysql
    env: image
    image:
      url: mysql:8.0
    disk:
      name: mysql-data
      mountPath: /var/lib/mysql
      sizeGB: 10
    envVars:
      - key: MYSQL_ROOT_PASSWORD
        generateValue: true
      - key: MYSQL_DATABASE
        value: killokart
      - key: MYSQL_USER
        value: killokart
      - key: MYSQL_PASSWORD
        generateValue: true

  - type: web
    name: killokart-api
    env: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: API_V1_PREFIX
        value: /api/v1
      # Point at the MySQL private service above (host = service name).
      # Fill in the generated MYSQL_USER / MYSQL_PASSWORD values after first deploy.
      - key: DATABASE_URL
        value: mysql+pymysql://killokart:REPLACE_WITH_MYSQL_PASSWORD@killokart-mysql:3306/killokart
      - key: WC_WEBHOOK_SECRET
        generateValue: true
      - key: WEBHOOK_SKIP_SIGNATURE
        value: false
      # Your Netlify frontend URL (no trailing slash). Allows browser calls to the API.
      - key: BACKEND_CORS_ORIGINS
        value: '["https://REPLACE_WITH_NETLIFY_URL"]'
      # Optional now — required only for LIVE WooCommerce sync (see DEPLOY.md).
      - key: WC_STORE_URL
        sync: false
      - key: WC_CONSUMER_KEY
        sync: false
      - key: WC_CONSUMER_SECRET
        sync: false
      # Optional SMTP for real emails (else log-only mode).
      - key: SMTP_HOST
        sync: false
      - key: SMTP_FROM_EMAIL
        value: no-reply@example.com
      # Public frontend URL (password-reset links). No trailing slash.
      - key: FRONTEND_URL
        sync: false
